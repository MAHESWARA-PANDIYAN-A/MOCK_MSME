services:
  # FastAPI Backend Service
  - type: web
    name: mock-msme-backend
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        value: sqlite:///./udyam_mock.db
      - key: SECRET_KEY
        generateValue: true
      - key: MOCK_UDYAM_API_KEY
        value: demo-secret-sih26130-udyam-key
      - key: MOCK_OTP
        value: "123456"
      - key: FRONTEND_URL
        value: "*"
